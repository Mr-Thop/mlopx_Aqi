# Scheduled or manual retraining on the sample data, with the registry gate deciding whether the model is accepted.
# With real data on a runner or server, set DATA_PATH to the Parquet location.
name: retrain

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Random-search trials per model family"
        default: "8"
  schedule:
    - cron: "0 3 * * 1"      # Mondays 03:00 UTC

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate data
        run: python -m mlops.pipeline check
      - name: Train, tune, gate
        env:
          RUN_DIR: ${{ runner.temp }}/run
          GIT_SHA: ${{ github.sha }}
        run: python -m mlops.pipeline run --trials ${{ github.event.inputs.trials || '8' }}
      - uses: actions/upload-artifact@v4
        with:
          name: retrain-${{ github.run_id }}
          path: ${{ runner.temp }}/run
