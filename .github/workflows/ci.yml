# Continuous integration and delivery.
# On every push and pull request: lint, unit and app tests, and a full training run on the committed sample data.
# On pushes to main, after every check has passed: publish the Docker image to ghcr.io and promote the tested commit
# to the `deploy` branch. Streamlit Community Cloud watches that branch, so only tested code is ever deployed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest -q
      - name: Train on the sample data (smoke test of the whole pipeline)
        env:
          RUN_DIR: ${{ runner.temp }}/run
          GIT_SHA: ${{ github.sha }}
        run: python -m mlops.pipeline run --trials 2
      - name: Upload training report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: ${{ runner.temp }}/run/last_summary.json

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (every push, to prove it builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aqi-mlops:ci
      - name: Smoke-test the container (API starts and reports health)
        run: |
          docker run -d --name api -p 8000:8000 -e RUN_DIR=/data aqi-mlops:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health | grep -q '"status"'
          docker rm -f api
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mr-thop/aqi-mlops:latest
            ghcr.io/mr-thop/aqi-mlops:${{ github.sha }}

  deploy:
    # Streamlit Community Cloud redeploys the app whenever the `deploy` branch moves.
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Promote the tested commit to the deploy branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git push --force origin HEAD:refs/heads/deploy
          echo "Promoted ${GITHUB_SHA} to deploy. Streamlit Community Cloud will redeploy streamlit_app/app.py." >> "$GITHUB_STEP_SUMMARY"
